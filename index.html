<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nugget 리포트</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="navbar">
      <div class="nav-item"><p>nugget 리포트</p></div>
      <div id="user-info">
        <p id="login-status">로그인 안됨</p>
        <button id="login-btn">로그인</button>
      </div>
    </div>

    <div class="main-layout">
      <div class="left-layout">
        <div class="report-panel">
          <div class="report-panel-header">
            <h2>리포트 작성</h2>
          </div>
          <div class="report-editor">
            <input id="report-title" placeholder="리포트 제목을 입력하세요" />
            <div class="report-dates">
              <label for="start-date">시작일</label>
              <input type="date" id="start-date" />
              <label for="end-date">종료일</label>
              <input type="date" id="end-date" />
            </div>
            <div id="report-contents">
              <p class="placeholder-text">질문을 통해 리포트를 작성하세요</p>
            </div>
            <div class="report-actions">
              <button class="report-button delete-button">리포트 삭제</button>
              <button class="report-button">리포트 저장</button>
            </div>
          </div>
        </div>
      </div>

      <div class="floating-question">
        <div class="lugget-ai-intro">
          <img
            src="https://i.ibb.co/DKsxWGv/lugget-ai.png"
            alt="AI 캐릭터"
            class="ai-character"
          />
          <div class="ai-intro-message-bubble">
            <p>리포트 작성을 도와드릴게요! 궁금한 점을 입력해주세요 :)</p>
          </div>
        </div>

        <div class="chat-container">
          <div class="chat-messages" id="chat-messages"></div>
        </div>

        <div class="floating-question-input">
          <textarea id="user-question" placeholder="질문을 입력하세요..."></textarea>
          <button id="submit-question">전송</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
